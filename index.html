<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超高速レジリエンス｜実践ワークシート</title>
<style>
  :root{
    --ivory:#FAF6EC;
    --ivory-deep:#F1E9D6;
    --paper:#FFFFFF;
    --ink:#221F1A;
    --ink-soft:#6B6558;
    --ink-faint:#A39D8C;
    --gold:#B8933E;
    --gold-light:#D9BA72;
    --gold-deep:#8A6A22;
    --line:rgba(184,147,62,0.32);
    --line-soft:rgba(184,147,62,0.16);
    --serif:'游明朝','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP', serif;
    --sans:'游ゴシック','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 10% -10%, var(--ivory-deep), transparent 60%),
      radial-gradient(1000px 600px at 110% 10%, var(--ivory-deep), transparent 55%),
      var(--ivory);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  header.top{
    padding:26px 20px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--line-soft);
  }
  header.top img.logo{height:42px;width:auto;display:block;}
  header.top .sub{
    font-size:12.5px;color:var(--ink-soft);text-align:center;
    max-width:480px;line-height:1.9;
  }

  main{max-width:640px;margin:0 auto;padding:22px 18px 60px;}

  .screen{display:none;}
  .screen.active{display:block;animation:fadeIn .3s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .identity-card{
    background:var(--paper);
    border:1px solid var(--line);
    padding:16px 18px;
    margin-bottom:22px;
  }
  .identity-card .ic-title{
    font-family:var(--serif);font-size:13px;color:var(--gold-deep);
    margin-bottom:10px;letter-spacing:.04em;
  }
  .identity-row{display:flex;gap:12px;}
  .identity-row label{
    flex:1;font-size:11px;color:var(--ink-faint);
    display:flex;flex-direction:column;gap:5px;
  }
  .identity-row input{
    font-family:var(--sans);font-size:14px;padding:8px 10px;
    border:1px solid var(--line);border-radius:2px;background:#FFFEFB;color:var(--ink);
  }
  .identity-row input:focus{outline:none;border-color:var(--gold);}

  .home-intro{font-size:13px;color:var(--ink-soft);line-height:2;margin-bottom:20px;}
  .chapter-group{margin-bottom:26px;}
  .chapter-group .cg-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;}
  .chapter-group .cg-num{font-family:var(--serif);font-size:14px;color:var(--gold-deep);}
  .chapter-group .cg-title{font-size:13px;color:var(--ink-soft);}
  .worklist{display:flex;flex-direction:column;gap:10px;}
  .worklist .witem{
    display:flex;align-items:center;gap:12px;
    background:var(--paper);border:1px solid var(--line);
    padding:14px 16px;cursor:pointer;transition:border-color .15s ease, transform .1s ease;
  }
  .worklist .witem:hover{border-color:var(--gold);}
  .worklist .witem:active{transform:scale(.995);}
  .worklist .witem .wcheck{
    width:22px;height:22px;border-radius:50%;flex:0 0 auto;
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:12px;color:transparent;
  }
  .worklist .witem.done .wcheck{background:var(--gold);border-color:var(--gold);color:#fff;}
  .worklist .witem .wtext{flex:1;}
  .worklist .witem .wtitle{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:3px;}
  .worklist .witem .whint{font-size:11.5px;color:var(--ink-faint);line-height:1.6;}
  .worklist .witem .warrow{color:var(--gold);font-size:16px;}

  .work-back{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;color:var(--ink-soft);cursor:pointer;margin-bottom:16px;
    border:1px solid var(--line);padding:7px 12px;border-radius:20px;
  }
  .work-back:hover{border-color:var(--gold);color:var(--ink);}

  .id-strip{
    display:flex;gap:16px;font-size:11.5px;color:var(--ink-faint);
    margin-bottom:14px;padding-bottom:10px;border-bottom:1px dotted var(--line);
  }
  .id-strip b{color:var(--ink-soft);font-weight:500;}

  .chapter-head{margin-bottom:18px;}
  .chapter-head .eyebrow{font-family:var(--serif);font-size:12.5px;color:var(--gold-deep);letter-spacing:.14em;margin-bottom:4px;}
  .chapter-head h2{font-family:var(--serif);font-weight:700;font-size:clamp(18px,4vw,22px);margin:0 0 8px;line-height:1.5;}
  .chapter-head .hint{
    font-size:12.5px;color:var(--ink-soft);background:var(--ivory-deep);
    border-left:2px solid var(--gold);padding:8px 12px;line-height:1.8;
  }
  .rule{height:1px;background:linear-gradient(90deg, var(--gold) 0%, var(--line-soft) 40%, transparent 100%);margin:14px 0 18px;}

  .card{background:var(--paper);border:1px solid var(--line);padding:18px 18px 20px;margin-top:14px;}
  .card .qn{font-family:var(--serif);font-size:12px;color:var(--gold-deep);letter-spacing:.06em;margin-bottom:6px;}
  .card label.field-label{display:block;font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:8px;line-height:1.7;}
  .card p.field-desc{font-size:12px;color:var(--ink-soft);margin:-4px 0 10px;line-height:1.8;}
  textarea, input[type=text]{
    width:100%;font-family:var(--sans);font-size:14px;line-height:1.8;
    padding:10px 12px;border:1px solid var(--line);border-radius:2px;
    background:#FFFEFB;color:var(--ink);resize:vertical;
  }
  textarea:focus, input[type=text]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,147,62,0.1);}
  textarea{min-height:70px;}

  .pillgrid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .pill{
    font-family:var(--sans);font-size:12.5px;padding:10px 14px;
    border:1px solid var(--line);border-radius:20px;background:var(--paper);
    color:var(--ink-soft);cursor:pointer;transition:all .15s ease;line-height:1.5;
  }
  .pill:hover{border-color:var(--gold);color:var(--ink);}
  .pill.selected{background:var(--ink);border-color:var(--ink);color:var(--ivory);}
  .pill .pdesc{display:block;font-size:10.5px;color:inherit;opacity:.75;margin-top:2px;}

  .switch-item{margin-bottom:14px;padding-bottom:14px;border-bottom:1px dotted var(--line-soft);}
  .switch-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .cbrow{display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:2px 0;}
  .cbrow input[type=checkbox]{
    margin-top:3px;width:18px;height:18px;accent-color:var(--gold-deep);
    flex:0 0 auto;cursor:pointer;
  }
  .cbrow .cbtext{display:flex;flex-direction:column;gap:3px;}
  .cbrow .cblabel{font-size:14px;color:var(--ink);font-weight:600;line-height:1.6;}
  .cbrow .cbsub{font-size:12px;color:var(--ink-soft);line-height:1.6;}
  .cb-inline-input{
    margin:8px 0 0 28px;width:calc(100% - 28px);font-family:var(--sans);font-size:13.5px;
    padding:8px 10px;border:1px solid var(--line);border-radius:2px;background:#FFFEFB;color:var(--ink);
  }
  .cb-inline-input:focus{outline:none;border-color:var(--gold);}
  .cb-category{font-size:12px;font-weight:700;color:var(--gold-deep);margin:16px 0 8px;letter-spacing:.03em;}
  .cb-category:first-of-type{margin-top:0;}
  .fixed-phrase{
    margin:8px 0 0 28px;padding:10px 12px;background:var(--ivory-deep);
    border-left:2px solid var(--gold);font-size:12.5px;line-height:1.85;color:var(--ink);
  }
  .fixed-phrase .fp-rule{font-size:11px;color:var(--gold-deep);font-weight:700;margin-bottom:4px;}
  .step-example{font-size:12px;color:var(--ink-faint);line-height:1.8;margin:-4px 0 10px;}
  .static-note{
    margin-top:16px;padding:14px 16px;background:var(--ivory-deep);border-left:3px solid var(--gold);
  }
  .static-note .sn-tag{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--gold-deep);margin-bottom:6px;}
  .static-note .sn-text{font-size:13.5px;line-height:1.9;color:var(--ink);}

  .insight{
    display:none;margin-top:14px;padding:14px 16px;
    background:var(--ivory-deep);border:1px solid var(--line);border-left:3px solid var(--gold);
  }
  .insight.show{display:block;animation:fadeIn .3s ease;}
  .insight .itag{font-family:var(--serif);font-size:12px;font-weight:700;color:var(--gold-deep);margin-bottom:6px;}
  .insight .itext{font-size:13.5px;line-height:1.9;color:var(--ink);}

  .repeater{margin-top:10px;}
  .tora-entry{border:1px solid var(--line);padding:14px 16px;margin-bottom:12px;position:relative;background:#FFFEFB;}
  .tora-entry .te-num{font-family:var(--serif);font-size:11px;color:var(--gold-deep);margin-bottom:8px;}
  .tora-entry .te-remove{
    position:absolute;top:10px;right:10px;font-size:11px;color:var(--ink-faint);
    cursor:pointer;border:1px solid var(--line);padding:3px 8px;border-radius:12px;
  }
  .tora-entry .te-remove:hover{color:#a33;border-color:#a33;}
  .tora-entry label.field-label{font-size:12.5px;margin-top:10px;}
  .tora-entry label.field-label:first-of-type{margin-top:0;}
  .add-entry-btn{
    font-size:12.5px;color:var(--gold-deep);border:1px dashed var(--gold);
    background:transparent;padding:9px 16px;cursor:pointer;width:100%;
  }
  .add-entry-btn:hover{background:var(--ivory-deep);}

  .status-line{display:flex;align-items:center;gap:8px;margin-top:20px;font-size:12.5px;color:var(--ink-faint);}
  .status-line .sdot{width:7px;height:7px;border-radius:50%;background:var(--line);}
  .status-line.ready{color:var(--gold-deep);}
  .status-line.ready .sdot{background:var(--gold);}

  .savebar{
    margin-top:16px;background:var(--paper);border:1px solid var(--line);
    padding:14px 16px;display:flex;flex-direction:column;gap:10px;
  }
  .savebar .slabel{font-size:11.5px;color:var(--ink-faint);line-height:1.7;}
  button.pdf-btn{
    font-family:var(--serif);font-weight:700;font-size:14px;letter-spacing:.05em;
    padding:12px 20px;border:none;border-radius:2px;cursor:pointer;white-space:nowrap;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s ease;width:100%;
  }
  button.pdf-btn.enabled{background:linear-gradient(135deg, var(--gold-light), var(--gold-deep));color:#1a1408;}
  button.pdf-btn.enabled:hover{filter:brightness(1.06);}
  button.pdf-btn.enabled:active{transform:scale(.98);}
  button.pdf-btn:disabled{background:var(--ivory-deep);color:var(--ink-faint);cursor:not-allowed;}

  .saved-note{
    display:none;margin-top:12px;font-size:12.5px;color:var(--gold-deep);
    padding:10px 14px;background:var(--ivory-deep);border-left:3px solid var(--gold);
  }
  .saved-note.show{display:block;}

  .pdf-btn .btn-spinner{
    width:13px;height:13px;border-radius:50%;
    border:2px solid rgba(26,20,8,0.25);border-top-color:#1a1408;
    display:none;animation:pdfspin .7s linear infinite;
  }
  .pdf-btn .btn-spinner.show{display:inline-block;}
  @keyframes pdfspin{to{transform:rotate(360deg);}}
</style>
</head>

function $(id){ return document.getElementById(id); }

function esc(s){ return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function checkedValues(workId, key){
  const nodes = document.querySelectorAll('input[type="checkbox"][data-work="'+workId+'"][data-key="'+key+'"]');
  const out = [];
  nodes.forEach(function(cb){ if(cb.checked) out.push(cb.dataset.value); });
  return out;
}
function isChecked(workId, key, value){
  const cb = document.querySelector('input[type="checkbox"][data-work="'+workId+'"][data-key="'+key+'"][data-value="'+value+'"]');
  return !!(cb && cb.checked);
}

function todayStr(){

function renderHomeList(){
  const container = $('workListContainer');
  container.innerHTML = '';
  const byChapter = {};
  WORKS.forEach(w=>{ (byChapter[w.ch] = byChapter[w.ch]||[]).push(w); });
  Object.keys(byChapter).sort().forEach(chNum=>{
    const group = document.createElement('div');
    group.className='chapter-group';
    const head = document.createElement('div');
    head.className='cg-head';
    head.innerHTML = '<span class="cg-num">'+byChapter[chNum][0].chLabel+'</span><span class="cg-title">'+CHAPTER_TITLES[chNum]+'</span>';
    group.appendChild(head);
    const list = document.createElement('div');
    list.className='worklist';
    byChapter[chNum].forEach(w=>{
      const item = document.createElement('div');
      item.className='witem' + (completed[w.id] ? ' done' : '');
      item.id = 'home-item-'+w.id;
      item.setAttribute('data-action','open-work');
      item.setAttribute('data-workid', w.id);
      item.innerHTML =
        '<div class="wcheck">✓</div>' +
        '<div class="wtext"><div class="wtitle">'+w.title+'</div><div class="whint">'+w.hint+'</div></div>' +
        '<div class="warrow">›</div>';
      list.appendChild(item);
    });
    group.appendChild(list);
    container.appendChild(group);
  });
}

function goHome(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('screen-home').classList.add('active');
  renderHomeList();
  window.scrollTo({top:0,behavior:'smooth'});
}

function openWork(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const target = $('screen-'+id);
  if(!target) return;
  target.classList.add('active');
  const nameEl = $('idstrip-name-'+id);
  const dateEl = $('idstrip-date-'+id);
  if(nameEl) nameEl.textContent = identity.name || '（記名なし）';
  if(dateEl) dateEl.textContent = identity.date;
  window.scrollTo({top:0,behavior:'smooth'});
}

function checkValid(workId){
  const fn = VALIDATORS[workId];
  const ok = fn ? !!fn() : false;
  const btn = $('pdfbtn-'+workId);
  const status = $('status-'+workId);
  const statusText = $('statustext-'+workId);
  if(!btn || !status || !statusText) return;

  if(ok){
    btn.disabled = false;
    btn.classList.add('enabled');
    status.classList.add('ready');
    statusText.textContent = '入力が完了しました。保存済みです。';
    completed[workId] = true;
  }else{
    btn.disabled = true;
    btn.classList.remove('enabled');
    status.classList.remove('ready');
    statusText.textContent = 'すべての項目を入力すると保存できます';
    completed[workId] = false;
  }
}

function pdfWrapText(ctx, text, maxWidth){
  const lines = [];
  let current = '';
  const str = text || '';
  for(let i=0;i<str.length;i++){
    const ch = str[i];
    if(ch === '\n'){ lines.push(current); current=''; continue; }
    const test = current + ch;
    if(ctx.measureText(test).width > maxWidth && current.length>0){
      lines.push(current);
      current = ch;
    }else{
      current = test;
    }
  }
  lines.push(current);
  return lines;
}

function pdfNewCanvas(){
  const canvas = document.createElement('canvas');
  canvas.width = PDF_PAGE_W;
  canvas.height = PDF_PAGE_H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = PDF_COLORS.ivory;
  ctx.fillRect(0,0,PDF_PAGE_W,PDF_PAGE_H);
  const inset = 41;
  ctx.strokeStyle = PDF_COLORS.gold;
  ctx.lineWidth = 3;
  ctx.strokeRect(inset, inset, PDF_PAGE_W-inset*2, PDF_PAGE_H-inset*2);
  ctx.strokeStyle = 'rgba(184,147,62,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(inset+4, inset+4, PDF_PAGE_W-(inset+4)*2, PDF_PAGE_H-(inset+4)*2);
  return {canvas:canvas, ctx:ctx};
}

function pdfDrawTopBar(ctx, name, date){
  const y = PDF_MARGIN;
  if(pdfLogoLoaded && pdfLogoImg && pdfLogoImg.naturalWidth){
    const h = 44;
    const w = pdfLogoImg.naturalWidth * (h/pdfLogoImg.naturalHeight);
    ctx.drawImage(pdfLogoImg, PDF_MARGIN, y, w, h);
  }
  ctx.textBaseline = 'top';
  ctx.textAlign = 'right';
  ctx.fillStyle = PDF_COLORS.ink;
  ctx.font = 'bold 19px '+PDF_FONT_SANS;
  ctx.fillText(name || '（記名なし）', PDF_PAGE_W-PDF_MARGIN, y);
  ctx.fillStyle = PDF_COLORS.inkSoft;
  ctx.font = '15px '+PDF_FONT_SANS;
  ctx.fillText(date || '', PDF_PAGE_W-PDF_MARGIN, y+26);
  ctx.textAlign = 'left';
  return y + 80;
}

function pdfDrawHeader(ctx, y, chLabel, title){
  ctx.textBaseline = 'top';
  ctx.fillStyle = PDF_COLORS.goldDeep;
  ctx.font = '20px '+PDF_FONT_SERIF;
  ctx.fillText(chLabel+'｜実践ワーク', PDF_MARGIN, y);
  y += 32;
  ctx.fillStyle = PDF_COLORS.ink;
  ctx.font = 'bold 29px '+PDF_FONT_SERIF;
  const lines = pdfWrapText(ctx, title, PDF_CONTENT_W);
  lines.forEach(function(line,i){ ctx.fillText(line, PDF_MARGIN, y+i*38); });
  y += lines.length*38 + 16;
  ctx.strokeStyle = PDF_COLORS.gold;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(PDF_MARGIN,y);
  ctx.lineTo(PDF_PAGE_W-PDF_MARGIN,y);
  ctx.stroke();
  return y + 34;
}

function pdfDrawSingleBox(ctx, y, label, value){
  ctx.textBaseline='top';
  ctx.fillStyle = PDF_COLORS.goldDeep;
  ctx.font = 'bold 16px '+PDF_FONT_SANS;
  ctx.fillText(label, PDF_MARGIN, y);
  y += 25;
  const has = !!(value && value.trim());
  const text = has ? value.trim() : '（未記入）';
  ctx.font = '17px '+PDF_FONT_SANS;
  const lines = pdfWrapText(ctx, text, PDF_CONTENT_W-32);
  const lineH = 26;
  const boxH = Math.max(48, lines.length*lineH + 22);
  ctx.fillStyle = PDF_COLORS.paper;
  ctx.fillRect(PDF_MARGIN, y, PDF_CONTENT_W, boxH);
  ctx.strokeStyle = PDF_COLORS.line;
  ctx.lineWidth = 1;
  ctx.strokeRect(PDF_MARGIN, y, PDF_CONTENT_W, boxH);
  ctx.fillStyle = has ? PDF_COLORS.ink : PDF_COLORS.inkFaint;
  lines.forEach(function(line,i){ ctx.fillText(line, PDF_MARGIN+16, y+13+i*lineH); });
  return y + boxH + 28;
}

function pdfDrawTwoBox(ctx, y, left, right){
  const gap = 28;
  const colW = (PDF_CONTENT_W - gap)/2;
  ctx.textBaseline='top';
  ctx.font = 'bold 16px '+PDF_FONT_SANS;
  ctx.fillStyle = PDF_COLORS.goldDeep;
  ctx.fillText(left.label, PDF_MARGIN, y);
  ctx.fillText(right.label, PDF_MARGIN+colW+gap, y);
  y += 25;
  ctx.font = '17px '+PDF_FONT_SANS;
  const leftHas = !!(left.value && left.value.trim());
  const rightHas = !!(right.value && right.value.trim());
  const leftText = leftHas ? left.value.trim() : '（未記入）';
  const rightText = rightHas ? right.value.trim() : '（未記入）';
  const leftLines = pdfWrapText(ctx, leftText, colW-30);
  const rightLines = pdfWrapText(ctx, rightText, colW-30);
  const lineH = 26;
  const boxH = Math.max(48, Math.max(leftLines.length, rightLines.length)*lineH + 22);
  [
    {x:PDF_MARGIN, lines:leftLines, has:leftHas},
    {x:PDF_MARGIN+colW+gap, lines:rightLines, has:rightHas}
  ].forEach(function(col){
    ctx.fillStyle = PDF_COLORS.paper;
    ctx.fillRect(col.x, y, colW, boxH);
    ctx.strokeStyle = PDF_COLORS.line;
    ctx.lineWidth = 1;
    ctx.strokeRect(col.x, y, colW, boxH);
    ctx.fillStyle = col.has ? PDF_COLORS.ink : PDF_COLORS.inkFaint;
    col.lines.forEach(function(line,i){ ctx.fillText(line, col.x+15, y+13+i*lineH); });
  });
  return y + boxH + 28;
}

function pdfDrawReframe(ctx, y, tag, text){
  ctx.textBaseline='top';
  ctx.font = '17px '+PDF_FONT_SANS;
  const lines = pdfWrapText(ctx, text, PDF_CONTENT_W-44);
  const lineH = 26;
  const boxH = lines.length*lineH + 46;
  ctx.fillStyle = PDF_COLORS.ivoryDeep;
  ctx.fillRect(PDF_MARGIN, y, PDF_CONTENT_W, boxH);
  ctx.fillStyle = PDF_COLORS.gold;
  ctx.fillRect(PDF_MARGIN, y, 5, boxH);
  ctx.fillStyle = PDF_COLORS.goldDeep;
  ctx.font = 'bold 14px '+PDF_FONT_SERIF;
  ctx.fillText(tag, PDF_MARGIN+22, y+14);
  ctx.fillStyle = PDF_COLORS.ink;
  ctx.font = '17px '+PDF_FONT_SANS;
  lines.forEach(function(line,i){ ctx.fillText(line, PDF_MARGIN+22, y+42+i*lineH); });
  return y + boxH + 28;
}

function pdfDrawPlain(ctx, y, label){
  ctx.textBaseline='top';
  ctx.fillStyle = PDF_COLORS.goldDeep;
  ctx.font = 'bold 16px '+PDF_FONT_SANS;
  const lines = pdfWrapText(ctx, label, PDF_CONTENT_W);
  lines.forEach(function(line,i){ ctx.fillText(line, PDF_MARGIN, y+i*23); });
  return y + lines.length*23 + 18;
}

function pdfDrawFooter(ctx, left, right){
  const y = PDF_PAGE_H - PDF_MARGIN - 28;
  ctx.strokeStyle = 'rgba(184,147,62,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(PDF_MARGIN,y);
  ctx.lineTo(PDF_PAGE_W-PDF_MARGIN,y);
  ctx.stroke();
  ctx.textBaseline='top';
  ctx.fillStyle = PDF_COLORS.inkFaint;
  ctx.font = '12px '+PDF_FONT_SANS;
  ctx.textAlign='left';
  ctx.fillText(left, PDF_MARGIN, y+10);
  ctx.textAlign='right';
  ctx.fillText(right, PDF_PAGE_W-PDF_MARGIN, y+10);
  ctx.textAlign='left';
}

function pdfDrawParagraph(ctx, y, text){
  ctx.textBaseline='top';
  ctx.fillStyle = PDF_COLORS.inkSoft;
  ctx.font = '15px '+PDF_FONT_SANS;
  const lines = pdfWrapText(ctx, text, PDF_CONTENT_W);
  const lineH = 23;
  lines.forEach(function(line,i){ ctx.fillText(line, PDF_MARGIN, y+i*lineH); });
  return y + lines.length*lineH + 18;
}

function pdfDrawChecklistItem(ctx, y, item){
  const indent = 34;
  ctx.textBaseline='top';
  ctx.strokeStyle = PDF_COLORS.goldDeep;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(PDF_MARGIN, y+3, 16, 16);
  if(item.marked){
    ctx.fillStyle = PDF_COLORS.goldDeep;
    ctx.fillRect(PDF_MARGIN+3, y+6, 10, 10);
  }
  ctx.fillStyle = PDF_COLORS.ink;
  ctx.font = 'bold 15px '+PDF_FONT_SANS;
  const labelLines = pdfWrapText(ctx, item.label, PDF_CONTENT_W-indent);
  labelLines.forEach(function(line,i){ ctx.fillText(line, PDF_MARGIN+indent, y+i*21); });
  y += labelLines.length*21 + 2;

  if(item.sub){
    ctx.fillStyle = PDF_COLORS.inkSoft;
    ctx.font = '12.5px '+PDF_FONT_SANS;
    const subLines = pdfWrapText(ctx, item.sub, PDF_CONTENT_W-indent);
    subLines.forEach(function(line,i){ ctx.fillText(line, PDF_MARGIN+indent, y+i*18); });
    y += subLines.length*18 + 4;
  }

  if(item.noteStyle==='input'){
    const has = item.noteValue && item.noteValue.trim();
    ctx.font = '14px '+PDF_FONT_SANS;
    const noteLines = pdfWrapText(ctx, has?item.noteValue.trim():'（未記入）', PDF_CONTENT_W-indent-24);
    const lineH = 20;
    const boxH = Math.max(28, noteLines.length*lineH + 12);
    ctx.fillStyle = PDF_COLORS.paper;
    ctx.fillRect(PDF_MARGIN+indent, y, PDF_CONTENT_W-indent, boxH);
    ctx.strokeStyle = PDF_COLORS.line;
    ctx.lineWidth = 1;
    ctx.strokeRect(PDF_MARGIN+indent, y, PDF_CONTENT_W-indent, boxH);
    ctx.fillStyle = has ? PDF_COLORS.ink : PDF_COLORS.inkFaint;
    noteLines.forEach(function(line,i){ ctx.fillText(line, PDF_MARGIN+indent+12, y+6+i*lineH); });
    y += boxH + 8;
  }else if(item.noteStyle==='fixed'){
    ctx.font = 'bold 11.5px '+PDF_FONT_SANS;
    const ruleLines = pdfWrapText(ctx, item.ruleText, PDF_CONTENT_W-indent-24);
    ctx.font = '13.5px '+PDF_FONT_SANS;
    const phraseLines = pdfWrapText(ctx, item.phraseText, PDF_CONTENT_W-indent-24);
    const lineH = 19;
    const boxH = 10 + ruleLines.length*15 + 6 + phraseLines.length*lineH + 10;
    ctx.fillStyle = PDF_COLORS.ivoryDeep;
    ctx.fillRect(PDF_MARGIN+indent, y, PDF_CONTENT_W-indent, boxH);
    ctx.fillStyle = PDF_COLORS.gold;
    ctx.fillRect(PDF_MARGIN+indent, y, 4, boxH);
    let iy = y+10;
    ctx.fillStyle = PDF_COLORS.goldDeep;
    ctx.font = 'bold 11.5px '+PDF_FONT_SANS;
    ruleLines.forEach(function(line,i){ ctx.fillText(line, PDF_MARGIN+indent+16, iy+i*15); });
    iy += ruleLines.length*15 + 6;
    ctx.fillStyle = PDF_COLORS.ink;
    ctx.font = '13.5px '+PDF_FONT_SANS;
    phraseLines.forEach(function(line,i){ ctx.fillText(line, PDF_MARGIN+indent+16, iy+i*lineH); });
    y += boxH + 8;
  }

  return y + 10;
}

function pdfDrawSectionDispatch(ctx, y, sec){
  if(sec.kind==='single') return pdfDrawSingleBox(ctx, y, sec.label, sec.value);
  if(sec.kind==='two') return pdfDrawTwoBox(ctx, y, sec.left, sec.right);
  if(sec.kind==='reframe') return pdfDrawReframe(ctx, y, sec.tag, sec.text);
  if(sec.kind==='plain') return pdfDrawPlain(ctx, y, sec.label);
  if(sec.kind==='paragraph') return pdfDrawParagraph(ctx, y, sec.text);
  if(sec.kind==='checklistItem') return pdfDrawChecklistItem(ctx, y, sec);
  return y;
}

function pdfMeasureSectionHeight(sec){
  const scratch = document.createElement('canvas');
  scratch.width = PDF_PAGE_W;
  scratch.height = 10;
  const ctx = scratch.getContext('2d');
  return pdfDrawSectionDispatch(ctx, 0, sec);
}

function pdfRenderPage(spec){
  const pages = [];
  let built = pdfNewCanvas();
  let y = pdfDrawTopBar(built.ctx, spec.name, spec.date);
  y = pdfDrawHeader(built.ctx, y, spec.chLabel, spec.title);
  const bottomLimit = PDF_PAGE_H - PDF_MARGIN - 70;

  function startNewPage(){
    pdfDrawFooter(built.ctx, spec.footerLeft, spec.footerRight);
    pages.push(built.canvas);
    built = pdfNewCanvas();
    let ny = pdfDrawTopBar(built.ctx, spec.name, spec.date);
    ny = pdfDrawHeader(built.ctx, ny, spec.chLabel, spec.title);
    return ny;
  }

  (spec.sections||[]).forEach(function(sec){
    const h = pdfMeasureSectionHeight(sec);
    if(y + h > bottomLimit && y > PDF_MARGIN+150){
      y = startNewPage();
    }
    y = pdfDrawSectionDispatch(built.ctx, y, sec);
  });

  pdfDrawFooter(built.ctx, spec.footerLeft, spec.footerRight);
  pages.push(built.canvas);
  return pages;
}

function canvasToJpegBytes(canvas, quality){
  const dataUrl = canvas.toDataURL('image/jpeg', quality || 0.9);
  const base64 = dataUrl.split(',')[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

/* minimal, dependency-free multi-page PDF writer: wraps one JPEG image per page */
function buildPdfFromJpegPages(pages){
  const PT_W = 595.28, PT_H = 841.89; // A4 in points
  const enc = new TextEncoder();
  const chunks = [];
  let offset = 0;
  function push(chunk){ chunks.push(chunk); offset += chunk.length; }
  function pushStr(str){ push(enc.encode(str)); }

  pushStr('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');

  const objOffsets = {};
  function beginObj(num){ objOffsets[num] = offset; }

  const nPages = pages.length;
  const kidsRefs = [];
  for(let k=0;k<nPages;k++){ kidsRefs.push((3+3*k)+' 0 R'); }

  beginObj(1);
  pushStr('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');

  beginObj(2);
  pushStr('2 0 obj\n<< /Type /Pages /Kids ['+kidsRefs.join(' ')+'] /Count '+nPages+' >>\nendobj\n');

  for(let k=0;k<nPages;k++){
    const pageObj = 3+3*k, contentObj = 4+3*k, imageObj = 5+3*k;
    const p = pages[k];

    beginObj(pageObj);
    pushStr(pageObj+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PT_W+' '+PT_H+'] /Resources << /XObject << /Im0 '+imageObj+' 0 R >> >> /Contents '+contentObj+' 0 R >>\nendobj\n');

    const content = 'q\n'+PT_W.toFixed(2)+' 0 0 '+PT_H.toFixed(2)+' 0 0 cm\n/Im0 Do\nQ';
    const contentBytes = enc.encode(content);
    beginObj(contentObj);
    pushStr(contentObj+' 0 obj\n<< /Length '+contentBytes.length+' >>\nstream\n');
    push(contentBytes);
    pushStr('\nendstream\nendobj\n');

    beginObj(imageObj);
    pushStr(imageObj+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.wpx+' /Height '+p.hpx+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.bytes.length+' >>\nstream\n');
    push(p.bytes);
    pushStr('\nendstream\nendobj\n');
  }

  const xrefStart = offset;
  const totalObjs = 2 + nPages*3;
  let xref = 'xref\n0 '+(totalObjs+1)+'\n0000000000 65535 f \n';
  for(let n=1;n<=totalObjs;n++){
    xref += String(objOffsets[n]).padStart(10,'0')+' 00000 n \n';
  }
  pushStr(xref);
  pushStr('trailer\n<< /Size '+(totalObjs+1)+' /Root 1 0 R >>\nstartxref\n'+xrefStart+'\n%%EOF');

  let total = 0;
  chunks.forEach(function(c){ total += c.length; });
  const out = new Uint8Array(total);
  let pos = 0;
  chunks.forEach(function(c){ out.set(c,pos); pos += c.length; });
  return out;
}

async function saveAsPdf(workId){
  if(!VALIDATORS[workId] || !VALIDATORS[workId]()) return;
  const btn = $('pdfbtn-'+workId);
  const spinner = $('pdfspinner-'+workId);
  const label = $('pdfbtnlabel-'+workId);
  if(btn) btn.disabled = true;
  if(spinner) spinner.classList.add('show');
  if(label) label.textContent = '生成中…';

  try{
    await ensureLogoLoaded();
    const w = WORKS.find(function(x){ return x.id===workId; });
    const spec = PDF_SPEC_BUILDERS[workId]();
    spec.name = identity.name;
    spec.date = identity.date;
    spec.chLabel = w.chLabel;
    spec.title = w.title;
    spec.footerLeft = PDF_FOOTER_LEFT;
    spec.footerRight = PDF_FOOTER_RIGHT;
    const canvases = pdfRenderPage(spec);

    const pages = canvases.map(function(c){
      return { bytes: canvasToJpegBytes(c, 0.9), wpx: c.width, hpx: c.height };
    });
    const pdfBytes = buildPdfFromJpegPages(pages);
    const blob = new Blob([pdfBytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = w.title + '.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);

    const homeItem = $('home-item-'+workId);
    if(homeItem) homeItem.classList.add('done');
    const savedNote = $('savednote-'+workId);
    if(savedNote) savedNote.classList.add('show');
  }catch(err){
    console.error(err);
    alert('PDFの生成に失敗しました。もう一度お試しください。');
  }finally{
    if(btn) btn.disabled = !VALIDATORS[workId]();
    if(label) label.textContent = 'PDFを保存する';
    if(spinner) spinner.classList.remove('show');
  }
}

document.addEventListener('click', function(e){
  const homeOpen = e.target.closest('[data-action="open-work"]');
  if(homeOpen){ openWork(homeOpen.dataset.workid); return; }

  const back = e.target.closest('[data-action="go-home"]');
  if(back){ goHome(); return; }

  const saveBtn = e.target.closest('[data-action="save-pdf"]');
  if(saveBtn && !saveBtn.disabled){ saveAsPdf(saveBtn.dataset.workid); return; }
});
